name: Deploy

# Whatever lands on the default branch goes live, at
# https://platinvm.github.io/us/ — so every URL in the build carries the `/us/`
# prefix. Point a custom domain at the site instead and `BASE_PATH` below
# becomes `/`.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half way through; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build for Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # A project page lives at https://<owner>.github.io/<repo>/, so every
          # URL — the bundle, the icons, the service worker's scope — has to
          # carry that prefix. Point a custom domain at the site instead and
          # this becomes '/'.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not on already. Without
          # this the first deploy fails on this step, because "Source: GitHub
          # Actions" is not something a fresh repository has set.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
